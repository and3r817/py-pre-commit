default_language_version:
  python: python3.14

repos:
  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: uv run ty check
        language: system
        types: [ python ]
        pass_filenames: false
        require_serial: true
      - id: vulture
        name: vulture dead code
        entry: ops/hooks/vulture
        language: script
        args: [ --min-confidence, "80", --sort-by-size ]
        pass_filenames: false
        require_serial: true
      - id: deptry
        name: deptry dependency hygiene
        entry: ops/hooks/deptry
        language: script
        args: [ --per-rule-ignores, "DEP002=uvicorn" ]
        pass_filenames: false
        require_serial: true
